services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tabula
      POSTGRES_PASSWORD: tabula
      POSTGRES_DB: tabula
    ports:
      - "5432:5432"
    volumes:
      - tabula_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabula -d tabula"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - tabula_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tabula_pg_data:
  tabula_redis_data:
